<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultKit — профессиональное шифрование</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="app">
        <nav class="nav">
            <div class="nav-brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span>VaultKit</span>
            </div>
            <div class="nav-actions">
                <button id="clearAllBtn" class="nav-btn">Очистить всё</button>
                <button id="settingsBtn" class="nav-btn">⚙️</button>
            </div>
        </nav>

        <main class="main">
            <div class="grid">
                <div class="panel">
                    <div class="mode-switch">
                        <button class="mode-btn active" data-mode="encrypt">🔒 Шифрование</button>
                        <button class="mode-btn" data-mode="decrypt">🔓 Дешифрование</button>
                    </div>

                    <div class="password-area">
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Ключевая фраза" autocomplete="off">
                            <button id="togglePassword" class="input-icon"></button>
                            <button id="generatePassword" class="input-icon right">🎲</button>
                        </div>
                        <div class="meter">
                            <div class="meter-fill" id="meterFill"></div>
                            <span class="meter-text" id="meterText">—</span>
                        </div>
                    </div>

                    <div class="dropzone" id="dropzone">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                            <path d="M12 3v12m0 0-3-3m3 3 3-3M5 17h14" stroke-linecap="round"/>
                        </svg>
                        <p>Перетащите файлы или папки</p>
                        <div class="dropzone-buttons">
                            <button id="selectFiles" class="btn-outline">📄 Файлы</button>
                            <button id="selectFolder" class="btn-outline">📁 Папку</button>
                        </div>
                        <input type="file" id="fileInput" multiple hidden>
                        <input type="file" id="folderInput" webkitdirectory directory hidden>
                    </div>

                    <div class="toolbar">
                        <button id="removeSelected" class="tool-btn" disabled>🗑 Удалить выбранное</button>
                        <button id="selectAll" class="tool-btn">✓ Выбрать всё</button>
                        <span class="tool-stats" id="stats">0 файлов</span>
                    </div>

                    <div class="filelist" id="filelist"></div>
                </div>

                <div class="panel">
                    <div class="options">
                        <div class="option">
                            <label class="checkbox">
                                <input type="checkbox" id="preserveStructure" checked>
                                <span>Сохранять структуру папок</span>
                            </label>
                        </div>
                        <div class="option">
                            <label class="checkbox">
                                <input type="checkbox" id="compressFirst">
                                <span>Сжимать перед шифрованием</span>
                            </label>
                        </div>
                        <div class="option">
                            <label>Имя выходного файла</label>
                            <input type="text" id="outputName" placeholder="archive" class="input-small">
                            <span class="ext">.vault</span>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="processBtn" class="btn-primary" disabled>
                            <span>▶ Начать обработку</span>
                        </button>
                    </div>

                    <div class="progress" id="progress" hidden>
                        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                        <div class="progress-info">
                            <span id="progressStatus">Подготовка...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                    </div>

                    <div class="history" id="history">
                        <div class="history-header">
                            <span>История операций</span>
                            <button id="clearHistory" class="text-btn">Очистить</button>
                        </div>
                        <div class="history-list" id="historyList">
                            <div class="history-empty">—</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/crypto-core.js"></script>
    <script src="js/file-handler.js"></script>
    <script src="js/archive-manager.js"></script>
    <script src="js/batch-processor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
